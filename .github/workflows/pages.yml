name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Restore
        run: dotnet restore HousingMarketSimulation.slnx

      - name: Build
        run: dotnet build HousingMarketSimulation.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HousingMarketSimulation.slnx --configuration Release --no-build

      - name: Generate dashboard
        run: dotnet run --project src/HousingMarketSimulation --configuration Release --no-build -- --dashboard

      - name: Verify Pages entry point
        run: test -f analysis-output/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: analysis-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
